openapi: 3.1.0
info:
  title: Redy Agents API
  version: 0.3.0
  description: Java demo-model service with an Agents API-style session and function-event subset.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Healthy
  /v1/agents/sessions:
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent:
                  $ref: '#/components/schemas/AgentConfig'
                input:
                  type: string
                  minLength: 1
                  description: Optional initial user message. This implementation supports the string shorthand only.
                environment:
                  $ref: '#/components/schemas/EnvironmentRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/agents/sessions/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    get:
      operationId: getSession
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/sessions/{sessionID}/environment/pause:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    post:
      operationId: pauseSessionEnvironment
      description: Pause an idle session's active CubeSandbox environment.
      responses:
        '200':
          description: Session with paused environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/agents/sessions/{sessionID}/environment/resume:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    post:
      operationId: resumeSessionEnvironment
      description: Resume an idle session's paused CubeSandbox environment.
      responses:
        '200':
          description: Session with active environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/agents/sessions/{sessionID}/environment/kill:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    post:
      operationId: killSessionEnvironment
      description: Permanently stop an idle session's active or paused CubeSandbox environment. The session history remains readable.
      responses:
        '200':
          description: Session with killed environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/agents/sessions/{sessionID}/turns:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    get:
      operationId: listTurns
      responses:
        '200':
          description: All turns for this session in creation order. Pagination is not yet supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: startTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
                  minLength: 1
      responses:
        '202':
          description: Turn accepted. If the latest input exceeds the prompt budget, the asynchronous turn later fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/agents/sessions/{sessionID}/turns/{turnID}:
    parameters:
      - $ref: '#/components/parameters/sessionID'
      - $ref: '#/components/parameters/turnID'
    get:
      operationId: getTurn
      responses:
        '200':
          description: Turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/sessions/{sessionID}/turns/{turnID}/cancel:
    parameters:
      - $ref: '#/components/parameters/sessionID'
      - $ref: '#/components/parameters/turnID'
    post:
      operationId: cancelTurn
      responses:
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/agents/sessions/{sessionID}/events:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    get:
      operationId: getEvents
      parameters:
        - name: after
          in: query
          description: Return events with a sequence greater than this cursor.
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          description: SSE reconnect cursor, used when after is omitted.
          schema:
            type: string
      responses:
        '200':
          description: JSON snapshot or SSE stream, selected by Accept header.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: submitEvents
      description: Submit user input, a function result, or cancellation. This subset accepts one user text part per message event. Multiple events are validated first, then applied in array order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/InputMessageEvent'
                      - $ref: '#/components/schemas/InputToolResultEvent'
                      - $ref: '#/components/schemas/InputCancelEvent'
      responses:
        '202':
          description: Events accepted; inspect the session and turn for outcomes.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/agents/sessions/{sessionID}/items:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    get:
      operationId: listItems
      responses:
        '200':
          description: All saved root-agent items for this session in creation order. Pagination is not yet supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    sessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
    turnID:
      name: turnID
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Input conflicts with the current session or turn state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: CubeSandbox provider is unavailable; a lifecycle action may be retried after checking the session environment state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AgentConfig:
      type: object
      required: [name, model]
      description: The prompt budget is context_window_tokens minus max_output_tokens minus a fixed 128-token reserve. The effective defaults are returned with the session.
      properties:
        name:
          type: string
        model:
          type: string
          description: Only demo is supported by the bundled model adapter.
        instructions:
          type: string
        context_window_tokens:
          type: integer
          minimum: 130
          default: 4096
          description: Total context window. Must exceed max_output_tokens by more than 128 tokens.
        max_output_tokens:
          type: integer
          minimum: 1
          default: 512
          description: Output allocation reserved before fitting the prompt. The bundled demo model does not enforce a generation limit.
    Session:
      type: object
      required: [id, agent, status, created_at, updated_at, environment]
      properties:
        id:
          type: string
        agent:
          $ref: '#/components/schemas/AgentConfig'
        status:
          type: string
          enum: [idle, in_progress, requires_action, failed]
        active_turn_id:
          type: string
        required_actions:
          type: array
          items:
            $ref: '#/components/schemas/RequiredAction'
        environment:
          $ref: '#/components/schemas/SessionEnvironment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvironmentRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [none, cube]
          description: cube is this service's self-hosted CubeSandbox extension.
        template_id:
          type: string
          description: CubeSandbox template ID, if a non-default template is needed.
      additionalProperties: false
    SessionEnvironment:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [none, cube]
        sandbox_id:
          type: string
          description: Provider sandbox ID, assigned when a cube session is created.
        template_id:
          type: string
        status:
          type: string
          enum: [active, pausing, paused, resuming, killing, killed]
          description: Present for cube environments. Transition states are durable and block new turns until the same lifecycle action is retried; killed cannot run another turn.
    Turn:
      type: object
      required: [id, session_id, input, status, created_at]
      properties:
        id:
          type: string
        session_id:
          type: string
        input:
          type: string
        status:
          type: string
          enum: [queued, in_progress, waiting, cancelling, completed, failed, cancelled]
          description: cancelling is a temporary local extension while an in-progress worker stops.
        output:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    RequiredAction:
      type: object
      required: [type, turn_id, call_id, name, arguments]
      properties:
        type:
          const: function_call
        turn_id:
          type: string
        call_id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
    InputMessageEvent:
      type: object
      required: [type, input]
      properties:
        type:
          const: agent.session.input.message
        input:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role:
                const: user
              content:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  required: [type, text]
                  properties:
                    type:
                      const: input_text
                    text:
                      type: string
                      minLength: 1
    InputToolResultEvent:
      type: object
      required: [type, turn_id, call_id, success]
      description: A successful result requires output as a string; a failed result requires error as a non-empty string.
      properties:
        type:
          const: agent.session.input.tool_result
        turn_id:
          type: string
          minLength: 1
        call_id:
          type: string
          minLength: 1
        success:
          type: boolean
        output:
          type: string
        error:
          type: string
    InputCancelEvent:
      type: object
      required: [type]
      properties:
        type:
          const: agent.session.input.cancel
    ItemPage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionItem'
        first_id:
          type: [string, 'null']
        last_id:
          type: [string, 'null']
        has_more:
          const: false
    TurnPage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Turn'
        first_id:
          type: [string, 'null']
        last_id:
          type: [string, 'null']
        has_more:
          const: false
    SessionItem:
      type: object
      required: [id, turn_id, type, created_at]
      properties:
        id:
          type: string
        turn_id:
          type: string
        type:
          type: string
        role:
          type: string
        content:
          type: string
        name:
          type: string
        call_id:
          type: string
        arguments_base64:
          type: string
        success:
          type: boolean
        created_at:
          type: string
          format: date-time
    Event:
      type: object
      required: [event_id, sequence, type, session_id, created_at]
      properties:
        event_id:
          type: string
          description: Stable ID formed from the session ID and per-session sequence.
        sequence:
          type: integer
        type:
          type: string
          description: Includes Agents API session/turn/item/output_text event names for the supported subset, plus the earlier turn.*, message.delta, tool.call.*, and context.compacted events.
        session_id:
          type: string
        turn_id:
          type: string
        created_at:
          type: string
          format: date-time
        session:
          $ref: '#/components/schemas/Session'
        turn:
          $ref: '#/components/schemas/Turn'
        item:
          $ref: '#/components/schemas/SessionItem'
        item_id:
          type: string
        output_index:
          type: integer
        content_index:
          type: integer
        delta:
          type: string
        text:
          type: string
        data:
          type: object
          description: Backward-compatible payload envelope. Official event fields also appear at the top level. For context.compacted, this includes step, estimated_prompt_tokens, prompt_budget_tokens, and omitted_messages. Estimates use UTF-8 byte counts plus overhead, not an exact model tokenizer.
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
