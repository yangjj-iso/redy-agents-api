server.address=${REDY_HOST:127.0.0.1}
server.port=${REDY_PORT:8080}
redy.data-dir=${REDY_DATA_DIR:.redy-data}
redy.cube.enabled=${REDY_CUBE_ENABLED:false}
redy.cube.api-url=${CUBE_API_URL:${E2B_API_URL:http://127.0.0.1:3000}}
redy.cube.api-key=${CUBE_API_KEY:${E2B_API_KEY:}}
redy.cube.template-id=${CUBE_TEMPLATE_ID:}
redy.cube.proxy-node-ip=${CUBE_PROXY_NODE_IP:}
redy.cube.proxy-port=${CUBE_PROXY_PORT_HTTP:80}
redy.cube.proxy-scheme=${CUBE_PROXY_SCHEME:http}
redy.cube.sandbox-domain=${CUBE_SANDBOX_DOMAIN:cube.app}
redy.cube.request-timeout=${CUBE_REQUEST_TIMEOUT:30s}
redy.cube.allow-internet-access=${CUBE_ALLOW_INTERNET_ACCESS:false}
redy.cube.idle-timeout-seconds=${CUBE_SANDBOX_IDLE_SECONDS:300}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.factory.constraints.read.max-document-length=1048576
